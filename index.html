        flex-direction: column;
        align-items: center;
        gap: 12px;

        border-radius: 4px;
        overflow: hidden;
        box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.6);
        margin-top: 4px;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #CAF5A8 0%, #69A06E 100%);
        border-radius: 4px;
        transition: width 0.15s ease-out;
        box-shadow: 0 0 10px #69A06E;
      }

      /* Fullscreen Toggle Button */
      #fullscreen-btn {
        position: fixed;
        bottom: 16px;

        height: 42px;

        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;

      #fullscreen-btn:hover {

      }
      #fullscreen-btn svg {
        width: 20px;
        height: 20px;
        fill: #e2e8f0;

      }

      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const fullscreenBtn = document.querySelector("#fullscreen-btn");

      // Safely notify Unity canvas to refit on orientation changes or visual viewport changes without infinite recursion
      function triggerCanvasRefit() {
        if (canvas) {
          window.dispatchEvent(new Event("resize"));
        }
      }
      window.addEventListener("orientationchange", () => {
        setTimeout(triggerCanvasRefit, 150);
      });
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", () => {
          setTimeout(triggerCanvasRefit, 100);
        }, { passive: true });
      }

      const buildUrl = "Build";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/a6bf8a2f2f953fd958d7340efc59acec.data.unityweb",
        frameworkUrl: buildUrl + "/fb12df0f0dfae6dd0bcc3e74e8918c62.framework.js.unityweb",
        codeUrl: buildUrl + "/d88e6e9499d24f7af61efd1a348a76f3.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
        companyName: "Evoweb",
        productName: "Ebglyss",
        productVersion: "0.0.1",
      };

      createUnityInstance(canvas, config, (progress) => {
        progressBarFull.style.width = (100 * progress) + "%";
      }).then((unityInstance) => {
        if (loadingBar) {
          loadingBar.style.opacity = "0";
          loadingBar.style.pointerEvents = "none";
          setTimeout(() => {
            loadingBar.style.display = "none";
          }, 500);
        }

        fullscreenBtn.onclick = () => {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (unityInstance.SetFullscreen) {
              unityInstance.SetFullscreen(1);
            } else if (document.documentElement.requestFullscreen) {
              document.documentElement.requestFullscreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
              document.documentElement.webkitRequestFullscreen();
            }
          } else {
            if (document.exitFullscreen) {
              document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
              document.webkitExitFullscreen();
            }
          }
        };
      }).catch((message) => {
        alert(message);
      });
    </script>

</html>
